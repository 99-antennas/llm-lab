services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: home_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d home_agent"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/home_agent
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  hermes:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: hermes
    command: ["gateway", "run", "--accept-hooks", "--quiet"]
    env_file:
      - .env
    environment:
      HERMES_HOME: /opt/data
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      GOOGLE_CLOUD_SM_KEYFILE: /run/secrets/google-cloud-sm.json
    volumes:
      - hermes-home:/opt/data
      - ${GOOGLE_CLOUD_SM_KEYFILE:?Set GOOGLE_CLOUD_SM_KEYFILE in .env}:/run/secrets/google-cloud-sm.json:ro
    expose:
      - "8642"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8642/health', timeout=5).read()"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    volumes:
      - ./pipelines:/app/pipelines
    ports:
      - "9099:9099"
    environment:
      PIPELINES_DIR: /app/pipelines
      PIPELINES_API_KEY: 0p3n-w3bu!
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    environment:
      # llama-server runs on the host (Metal GPU acceleration requires native process)
      # Start it with: ./scripts/start_llama_server.sh
      OPENAI_API_BASE_URL: http://host.docker.internal:8080/v1
      OPENAI_API_KEY: "not-needed"
      WEBUI_URL: http://loveshack:3000
      ENV: dev
      ENABLE_API_KEYS: "true"
    volumes:
      - open-webui:/app/backend/data
    ports:
      - "3000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      hermes:
        condition: service_healthy
      pipelines:
        condition: service_started

volumes:
  postgres-data:
  hermes-home:
  open-webui:
    external: true
