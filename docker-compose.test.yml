services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: home_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54321:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d home_agent"]
      interval: 5s
      timeout: 3s
      retries: 20
