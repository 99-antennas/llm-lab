[project]
name = "home-agent"
version = "0.1.0"
description = "Home AI Agent Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "tortoise-orm>=0.21.0",
  "aerich>=0.7.0",
  "asyncpg>=0.29.0",
  "httpx>=0.27.0",
  "pyyaml>=6.0.0",
  "pydantic-settings>=2.4.0",
  "google-cloud-secret-manager>=2.23.0",
  "google-cloud-storage>=2.18.0",
  "google-api-python-client>=2.154.0",
  "google-auth>=2.36.0",
  "pypdf>=4.0.0",
  "openpyxl>=3.1.0",
  "python-docx>=1.1.0",
  "python-multipart>=0.0.9",
  "anthropic>=0.40.0",
  "pillow>=10.0.0",
  "pillow-heif>=0.18.0",
  "hermes-agent>=0.14.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "clients"]

[tool.aerich]
tortoise_orm = "apps.api.db.base.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
